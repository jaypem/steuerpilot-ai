name: Check External Sources

# Runs every Monday at 08:07 UTC — catches broken URLs early in the week.
# Also triggered manually for ad-hoc checks.
on:
  schedule:
    - cron: "7 8 * * 1" # every Monday at 08:07 UTC
  workflow_dispatch:
    # manual trigger for ad-hoc checks

jobs:
  check-sources:
    name: URL Freshness Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --no-dev

      - name: Run check-sources
        working-directory: backend
        run: uv run steuerpilot check-sources

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[check-sources] Externe Quelle nicht erreichbar (${today})`,
              body: [
                '## Wöchentlicher URL-Check fehlgeschlagen',
                '',
                `Datum: ${today}`,
                'Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
                '',
                'Mindestens eine externe Rechtsquelle ist nicht mehr erreichbar.',
                'Bitte URL in `backend/ingest/scrapers/registry.py` prüfen und aktualisieren.',
                '',
                '| Quelle | Wo nachschlagen |',
                '|--------|----------------|',
                '| EStG / AO / UStG / EStDV / SolzG / GewStG / KStG / ErbStG / ArbNErfG | gesetze-im-internet.de |',
                '| LStR | lsth.bundesfinanzministerium.de → Jahresauswahl-Dropdown → `lsth/{YYYY}/home.html` |',
                '| BMF-Schreiben | `backend/ingest/scrapers/bmf_catalog.py` — URLs einzeln prüfen |',
                '| BFH-Urteile | `backend/ingest/scrapers/bfh_catalog.py` — ECLI-Links prüfen |',
                '',
                'Nach dem Fix: `make local.ingest YEAR=<YYYY>` ausführen.',
              ].join('\n'),
              labels: ['maintenance', 'data-pipeline'],
            });
